services:
  - type: web
    name: brandpulse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: APP_DATA_MODE
        value: production
      - key: DATABASE_URL
        value: sqlite:///./brandpulse.db
      - key: USE_MOCK_AI
        value: "true"
