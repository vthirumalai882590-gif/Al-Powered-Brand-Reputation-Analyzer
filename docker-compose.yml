version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandpulse-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://brandpulse_user:brandpulse_pass@postgres:5432/brandpulse_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=brandpulse_super_secret_jwt_key_2026_docker
      - DEMO_MODE=True
      - USE_MOCK_AI=True
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brandpulse-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: brandpulse-postgres
    environment:
      POSTGRES_USER: brandpulse_user
      POSTGRES_PASSWORD: brandpulse_pass
      POSTGRES_DB: brandpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: brandpulse-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
